services:
  db:
    image: postgres:16-alpine
    container_name: revision_app_db
    environment:
      - POSTGRES_USER=revision
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=revision_app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - revision_app-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revision -d revision_app"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: revision_app
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_URL=postgres://revision:${POSTGRES_PASSWORD}@db:5432/revision_app
      - AUTH_SERVICE_URL=http://auth-service:4001
    volumes:
      - revision_app-data:/repo/apps/frontend/data
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: revision_auth_service
    environment:
      - DATABASE_URL=postgres://revision:${POSTGRES_PASSWORD}@db:5432/revision_auth
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  revision_app-data:
    external: true
  revision_app-db:
    external: true
