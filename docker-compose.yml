services:
  db:
    image: postgres:16-alpine
    container_name: revision_app_db
    environment:
      - POSTGRES_USER=revision
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=revision_app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - revision_app-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revision -d revision_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: revision_app
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:4001
      - FILES_SERVICE_URL=http://files-service:4003
      - CONTENT_SERVICE_URL=http://content-service:4002
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
      files-service:
        condition: service_started
      content-service:
        condition: service_started
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: revision_auth_service
    environment:
      - DATABASE_URL=postgres://revision:${POSTGRES_PASSWORD}@db:5432/revision_auth
      - SESSION_SECRET=${SESSION_SECRET}
      - SERVICE_SECRET=${SERVICE_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://127.0.0.1:3200}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  files-service:
    build:
      context: .
      dockerfile: services/files-service/Dockerfile
    container_name: revision_files_service
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - FILES_DIR=/data/files
    volumes:
      - revision_files-data:/data/files
    restart: unless-stopped

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: revision_content_service
    environment:
      - DATABASE_URL=postgres://revision:${POSTGRES_PASSWORD}@db:5432/revision_content
      - SESSION_SECRET=${SESSION_SECRET}
      - SERVICE_SECRET=${SERVICE_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:4001
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

volumes:
  revision_app-db:
    external: true
  revision_files-data:
    external: true
